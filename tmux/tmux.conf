set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind r
bind r source-file ~/.tmux.conf

unbind ^A
bind ^A select-pane -t :.+

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim, and 'y'/Enter to copy to the macOS clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind ']' to paste from the macOS clipboard
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

set -sg escape-time 0

set-window-option -g automatic-rename off
set-option -g history-limit 10000

set-option -g status-bg black
set-option -g status-fg white
set-window-option -g status-left " #S "
set-window-option -g status-left-fg black
set-window-option -g status-left-bg white

set-option -g status-right-length 70
set-window-option -g status-right " #[fg=yellow]-#(head -n1 ~/.todo)-#[fg=white] %H:%M %d-%b "
set-window-option -g status-right-fg white
set-window-option -g status-right-bg black

set-window-option -g window-status-format " #I: #W "

set-window-option -g window-status-current-format " #I: #W "
set-window-option -g window-status-current-fg white
set-window-option -g window-status-current-bg blue

bind-key c new-window -n '---'
